name: Add PR Number to Title

on:
  workflow_run:
    workflows: [Pull Request Title]
    types: [completed]

# This privileged workflow only handles PR metadata; do not fetch artifacts or PR code here.
permissions: {}

concurrency:
  group: pr-title-number-${{ github.event.workflow_run.pull_requests[0].number || format('{0}:{1}', github.event.workflow_run.head_repository.full_name, github.event.workflow_run.head_branch) || github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  add-pr-number:
    if: github.event.workflow_run.event == 'pull_request' && vars.NAUTH_TITLE_BOT_APP_CLIENT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - name: Create title-bot token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.NAUTH_TITLE_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.NAUTH_TITLE_BOT_APP_PRIVATE_KEY }}
          permission-pull-requests: write

      - name: Add PR number to title
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          if [[ -z "$PR_NUMBER" ]]; then
            if [[ -z "$HEAD_REPOSITORY" || -z "$HEAD_BRANCH" || -z "$HEAD_SHA" ]]; then
              echo "::error::The completed pull-request workflow run is missing the head repository, branch, or SHA."
              exit 1
            fi

            head_owner="${HEAD_REPOSITORY%%/*}"
            if [[ "$head_owner" == "$HEAD_REPOSITORY" ]]; then
              echo "::error::The completed pull-request workflow run has an invalid head repository."
              exit 1
            fi

            open_pull_requests="$(curl --silent --show-error --fail-with-body --get \
              --url "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pulls" \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --data-urlencode 'state=open' \
              --data-urlencode "head=${head_owner}:${HEAD_BRANCH}" \
              --data-urlencode 'per_page=100')"

            matching_pr_numbers="$(jq -ce --arg head_sha "$HEAD_SHA" \
              '[.[] | select(.head.sha == $head_sha) | .number]' \
              <<< "$open_pull_requests")"
            mapfile -t PR_NUMBERS < <(jq -r '.[]' <<< "$matching_pr_numbers")

            if [[ ${#PR_NUMBERS[@]} -eq 0 ]]; then
              echo "No open PR matches head ${HEAD_REPOSITORY}@${HEAD_SHA}; skipping title update."
              exit 0
            fi
          else
            PR_NUMBERS=("$PR_NUMBER")
          fi

          for PR_NUMBER in "${PR_NUMBERS[@]}"; do
            pull_request="$(curl --silent --show-error --fail-with-body \
              --url "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28')"

            if [[ "$(jq -er '.state' <<< "$pull_request")" != "open" ]]; then
              echo "PR #${PR_NUMBER} is no longer open; skipping title update."
              continue
            fi

            current_title="$(jq -er '.title' <<< "$pull_request")"
            base_title="$(sed -E 's/[[:space:]]+\(#[0-9]+\)$//; s/[[:space:]]+$//' <<< "$current_title")"
            expected_title="${base_title} (#${PR_NUMBER})"

            if [[ "$current_title" == "$expected_title" ]]; then
              echo "PR #${PR_NUMBER} title already includes its PR number."
              continue
            fi

            response="$(curl --silent --show-error --fail-with-body \
              --request PATCH \
              --url "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
              --header 'Accept: application/vnd.github+json' \
              --header 'Content-Type: application/json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --data-binary "$(jq -n --arg title "$expected_title" '{title: $title}')")"

            if [[ "$(jq -er '.title' <<< "$response")" != "$expected_title" ]]; then
              echo "::error::GitHub did not save the expected title for PR #${PR_NUMBER}."
              exit 1
            fi

            echo "Added PR #${PR_NUMBER} to the PR title."
          done
