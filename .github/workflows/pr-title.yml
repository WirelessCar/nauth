name: Pull Request Title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  merge_group:
    types: [checks_requested]
    branches: [main]

permissions: {}

jobs:
  test-labeler:
    name: Test Breaking-change Labeler
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node --check .github/actions/label-breaking-change/index.cjs
      - run: node --test .github/actions/label-breaking-change/index.test.cjs

  validate-title:
    name: Validate Conventional PR Title
    runs-on: ubuntu-latest
    steps:
      - name: Skip title validation for merge group
        if: github.event_name == 'merge_group'
        run: echo "PR title was validated on the pull request before queue admission."

      - name: Validate pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          if [[ "$PR_TITLE" =~ [[:space:]]\(#[0-9]+\)$ ]]; then
            echo "::error::Do not append a PR number to the title; GitHub adds it to the merge commit automatically."
            exit 1
          fi

          base_title="$PR_TITLE"
          title_pattern='^[a-z][a-z0-9-]*(\([[:alnum:]._/-]+\))?!?: .+$'
          if [[ "$base_title" =~ $title_pattern ]]; then
            echo "PR title follows Conventional Commits syntax."
          else
            echo "::error::PR title must use Conventional Commits syntax, for example 'feat(api): add token validation'."
            exit 1
          fi
