apiVersion: nauth.io/v1alpha1
kind: Account
metadata:
  name: export-account
status:
  conditions:
    - type: NATSAccountComplete
      status: "True"
      reason: OK
    - type: Ready
      status: "True"
      reason: Reconciled
  claims:
    exports:
      - subject: export-delayed.>
        type: stream
