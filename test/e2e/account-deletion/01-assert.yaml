apiVersion: nauth.io/v1alpha1
kind: Account
metadata:
  name: example-account
status:
  conditions:
    - type: NATSAccountComplete
      status: "True"
      reason: OK
    - type: Ready
      status: "True"
      reason: Reconciled

---
apiVersion: v1
kind: Secret
metadata:
  labels:
    nauth.io/managed: "true"
    nauth.io/secret-type: account-root
type: Opaque

---
apiVersion: v1
kind: Secret
metadata:
  labels:
    nauth.io/managed: "true"
    nauth.io/secret-type: account-sign
type: Opaque
