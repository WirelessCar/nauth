apiVersion: kuttl.dev/v1beta1
kind: TestAssert
timeout: 60
resourceRefs:
  - apiVersion: nauth.io/v1alpha1
    kind: Account
    name: import-account
    ref: import_account
  - apiVersion: nauth.io/v1alpha1
    kind: Account
    name: export-account
    ref: export_account
assertAll:
  - celExpr: import_account.status.conditions.exists(c, c.type == "NATSAccountComplete" && c.status == "False" && c.reason == "NotReady" && c.message.contains("NATS reports invalid imports") && c.message.contains("removed.>") && c.message.contains("inline-removed.>") && c.message.contains(export_account.metadata.labels["account.nauth.io/id"]))
  - celExpr: import_account.status.conditions.exists(c, c.type == "Ready" && c.status == "False" && c.reason == "NotReady")
  - celExpr: has(import_account.status.nats) && import_account.status.nats.observedClaimsHash == import_account.status.claimsHash
  - celExpr: has(import_account.status.nats) && has(import_account.status.nats.observedImportDependenciesHash)
  - celExpr: export_account.status.conditions.exists(c, c.type == "NATSAccountComplete" && c.status == "True" && c.reason == "OK")
  - celExpr: export_account.status.conditions.exists(c, c.type == "Ready" && c.status == "True" && c.reason == "Reconciled")
