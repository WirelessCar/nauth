apiVersion: kuttl.dev/v1beta1
kind: TestAssert
timeout: 30
resourceRefs:
  - apiVersion: nauth.io/v1alpha1
    kind: NatsCluster
    name: tls-cluster
    ref: cluster
assertAll:
  - celExpr: cluster.spec.tls.caRef.key == "ca.crt"
  - celExpr: cluster.status.conditions.exists(c, c.type == "Ready" && c.status == "False" && c.reason == "Errored")
  - celExpr: cluster.status.conditions.exists(c, c.type == "Ready" && c.message.contains("resolve TLS for NatsCluster") && c.message.contains("nats-ca"))
