# Provide the CA bundle and point caRef at its key. Changing the key bumps the generation so the
# NatsCluster is reconciled again; periodic revalidation is out of scope (issue #376).
apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-ca
data:
  bundle.pem: |
