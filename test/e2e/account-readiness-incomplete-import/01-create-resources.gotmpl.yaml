apiVersion: nauth.io/v1alpha1
kind: Account
metadata:
  name: import-account
spec:
  natsClusterRef:
    namespace: nats
    name: local-nats
---
apiVersion: nauth.io/v1alpha1
kind: Account
metadata:
  name: export-account
spec:
  natsClusterRef:
    namespace: nats
    name: local-nats
  exports:
    - subject: allowed.>
      type: stream
---
apiVersion: nauth.io/v1alpha1
kind: AccountImport
metadata:
  name: import-rule
spec:
  accountName: import-account
  exportAccountRef:
    name: export-account
    namespace: {{ .Namespace }}
  rules:
    - name: not-allowed-rule
      subject: not-allowed.>
      type: stream
