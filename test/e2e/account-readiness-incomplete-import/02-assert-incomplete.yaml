apiVersion: kuttl.dev/v1beta1
kind: TestAssert
timeout: 20
resourceRefs:
  - apiVersion: nauth.io/v1alpha1
    kind: Account
    name: import-account
    ref: import_account
  - apiVersion: nauth.io/v1alpha1
    kind: Account
    name: export-account
    ref: export_account
assertAll:
  - celExpr: import_account.status.conditions.exists(c, c.type == "NATSAccountComplete" && c.status == "False" && c.reason == "NotReady")
  - celExpr: import_account.status.conditions.exists(c, c.type == "Ready" && c.status == "False" && c.reason == "NotReady")
  - celExpr: has(import_account.status.nats) && has(import_account.status.nats.stateValidatedAt)
  - celExpr: has(import_account.status.nats) && import_account.status.nats.observedServerId != ""
  - celExpr: has(import_account.status.nats) && import_account.status.nats.observedClaimsHash == import_account.status.claimsHash
  - celExpr: export_account.status.conditions.exists(c, c.type == "NATSAccountComplete" && c.status == "True" && c.reason == "OK")
  - celExpr: export_account.status.conditions.exists(c, c.type == "Ready" && c.status == "True" && c.reason == "Reconciled")
