# Default values for nauth.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  # -- Additional labels to add to templated NAuth chart resources.
  labels: {}
  # custom.label.environment: dev
  # custom.label.team: team-potato

nats:
  # To move from one operator-level NatsCluster binding to explicit per-Account
  # bindings, first set this reference in strict mode, then add matching
  # `spec.natsClusterRef` values to existing Accounts, and finally remove the
  # operator-level reference once all Accounts declare their target cluster.
  #
  # With `optional=false`, account-level refs must either be unset or match this cluster.
  # With `optional=true`, accounts without `spec.natsClusterRef` use this cluster, and accounts may override it.
  # -- Operator-level NatsCluster reference. Set `name` to bind the operator to one NATS cluster.
  clusterRef:
    # -- NatsCluster resource name. Leave empty to disable operator-level binding.
    name: ""

    # -- NatsCluster resource namespace. When empty and `name` is set, the chart namespace is used.
    namespace: ""

    # -- Whether account-level `spec.natsClusterRef` values may override this operator-level cluster.
    optional: false

# -- Number of NAuth operator replicas.
replicaCount: 1

image:
  # -- Container image registry for the NAuth operator.
  registry: ghcr.io/wirelesscar
  # -- Container image repository for the NAuth operator.
  repository: nauth-operator
  # -- Kubernetes image pull policy for the NAuth operator container.
  pullPolicy: IfNotPresent
  # -- Override the container image tag. Defaults to the chart app version when empty.
  # @default -- appVersion
  tag: ""

# -- Override the chart name used in generated resource names.
nameOverride: ""

# -- Override the full generated resource name. Defaults to `<Release.Name>-<Chart.Name>`.
fullnameOverride: ""

namespace:
  # -- Override the namespace rendered into namespaced resources. Defaults to the Helm release namespace.
  nameOverride: ""

# -- Limit the operator to the configured namespace instead of watching all namespaces.
namespaced: false

logging:
  # -- Operator log output format. Leave empty to use the operator default. Set to `json` for structured log ingestion. Supported values: `text`, `json`.
  format: ""
  # -- Operator log level. Supported values: `debug`, `info`, `warn`, `error`.
  level: ""

serviceAccount:
  # -- Create a ServiceAccount for the NAuth operator.
  create: true
  # TODO(#345): Decide whether to render this value or remove it from the public values API.
  # -- Reserved value for ServiceAccount token automounting. This value is not currently rendered by the chart.
  automount: true
  # -- Annotations to add to the ServiceAccount.
  annotations: {}
  # -- Override the ServiceAccount name. Defaults to the generated full name when empty.
  nameOverride: ""

# -- Annotations to add to the NAuth operator Pod.
podAnnotations: {}

# TODO(#345): Decide whether to render this value or remove it from the public values API.
# -- Reserved value for labels on the NAuth operator Pod. This value is not currently rendered by the chart.
podLabels: {}

# -- Pod security context for the NAuth operator Pod.
podSecurityContext:
  runAsNonRoot: true
  # fsGroup: 2000

# -- Container security context for the NAuth operator container.
securityContext:
  # This is defined by the distroless nonroot user
  runAsUser: 65532
  runAsGroup: 65532
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - "ALL"
  seccompProfile:
    type: RuntimeDefault

monitoring:
  # -- Expose controller-runtime Prometheus metrics on `/metrics` for direct scraping or collection through a Prometheus receiver.
  enabled: false
  serviceMonitor:
    # -- Create Prometheus Operator ServiceMonitor and PrometheusRule resources. Requires the ServiceMonitor and PrometheusRule CRDs.
    enabled: false

# -- Resource requests and limits for the NAuth operator container.
resources: {}
# limits:
#   cpu: 100m
#   memory: 128Mi
# requests:
#   cpu: 100m
#   memory: 128Mi

# -- Liveness probe for the NAuth operator container.
livenessProbe:
  httpGet:
    path: /healthz
    port: 8081
  initialDelaySeconds: 15
  periodSeconds: 20

# -- Readiness probe for the NAuth operator container.
readinessProbe:
  httpGet:
    path: /readyz
    port: 8081
  initialDelaySeconds: 5
  periodSeconds: 10

# -- Additional volumes for the NAuth operator Pod.
volumes: []

# -- Additional volume mounts for the NAuth operator container.
volumeMounts: []

# -- Termination grace period for the NAuth operator Pod, in seconds.
terminationGracePeriodSeconds: 10

# -- Node selector for scheduling the NAuth operator Pod.
nodeSelector: {}

# -- Tolerations for scheduling the NAuth operator Pod.
tolerations: []

# -- Affinity rules for scheduling the NAuth operator Pod.
affinity: {}

crds:
  # -- Install and upgrade NAuth CustomResourceDefinitions as part of this chart release.
  install: true
  # -- Keep NAuth CustomResourceDefinitions when this chart release is uninstalled.
  keep: true

# -- Additional Kubernetes resources to render with the chart. Values are templated before rendering.
extraResources: []
