suite: .Values.imagePullSecrets on deployment
templates:
  - deployment.yaml
tests:
  - it: propagates imagePullSecrets to the operator Pod
    set:
      imagePullSecrets:
        - name: registry-a
        - name: registry-b
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets
          value:
            - name: registry-a
            - name: registry-b

  - it: omits imagePullSecrets by default
    asserts:
      - notExists:
          path: spec.template.spec.imagePullSecrets

  - it: handles nil imagePullSecrets
    set:
      imagePullSecrets: ~
    asserts:
      - notExists:
          path: spec.template.spec.imagePullSecrets
