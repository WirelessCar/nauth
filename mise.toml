[env]
NATS_NAMESPACE = "nats"
NATS_VERSION = "2.14.0-alpine"
NACK_VERSION = "0.24.0"
NATS_RELOADER_VERSION = "0.24.0"
NATS_BOX_VERSION = "0.19.5"
HELM_VALUES_SCHEMA_JSON_VERSION = "v2.5.0"

[tools]
go = "1.27.0"
python = "3.14.5"
uv = "0.12.1"
ginkgo = "2.32.0"
adr-tools = "3.0.0"
nsc = "2.15.0"
helm = "4.2.1"
kind = "0.33.0"
helm-docs = "1.14.2"
vale = "3.20.0"
"github:elastic/crd-ref-docs" = "0.3.0"
"go:github.com/nats-io/natscli/nats" = "0.4.0"
kubectl-kuttl = "0.26.0"
jq = "1.8.1"

[settings]
experimental = true
disable_tools = ["controller-gen"]

[tasks.go-test]
description = "Run go tests"
dir = "{{ cwd }}"
alias = "gt"
run = "go test ./..."

[tasks."nauth:lint-docs"]
description = "Lint public documentation with Vale"
alias = "nld"
run = "vale README.md www/src/content/docs/index.mdx www/src/content/docs/guides"

[tasks."nauth:generate-values-schema"]
description = "Generate Helm values schema from charts/nauth/values.yaml"
run = """
if ! helm plugin list | awk 'NR > 1 { print $1 }' | grep -qx schema; then
  helm plugin install https://github.com/losisin/helm-values-schema-json.git --version="${HELM_VALUES_SCHEMA_JSON_VERSION}" --verify=false
fi

expected_version="helm schema version ${HELM_VALUES_SCHEMA_JSON_VERSION}"
actual_version="$(helm schema version)"
if [ "${actual_version}" != "${expected_version}" ]; then
  echo "helm-values-schema-json ${HELM_VALUES_SCHEMA_JSON_VERSION} is required, got: ${actual_version}" >&2
  echo "Run: helm plugin install https://github.com/losisin/helm-values-schema-json.git --version=${HELM_VALUES_SCHEMA_JSON_VERSION} --verify=false" >&2
  exit 1
fi

cd charts/nauth
helm schema lint --strict
helm schema
"""

[tasks."nauth:check-values-schema"]
description = "Verify generated Helm values schema is up to date"
run = """
mise run nauth:generate-values-schema
git ls-files --error-unmatch charts/nauth/values.schema.json >/dev/null 2>&1
git diff --exit-code -- charts/nauth/values.schema.json
"""

[tasks."nauth:e2e-test"]
silent = false
description = "Run end-to-end tests"
run = """
make build-e2e-ctl
PATH="$PWD/bin:$PATH" kubectl kuttl test
"""

[tasks."nauth:kuttle-k9s"]
silent = true
alias = "kk9s"
description = "Run K9s in the test environment (kind)"
run = "KUBECONFIG=kubeconfig k9s"
